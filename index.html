<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lead Finder">
<meta name="theme-color" content="#111418">
<title>Lead Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232e7d32'/%3E%3Ccircle cx='32' cy='28' r='10' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e7d32'/%3E%3Ccircle cx='32' cy='28' r='11' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#111418;--panel:#1b2026;--panel2:#242b33;--line:#2f3842;--text:#e9edf1;--muted:#98a4b1;
  --t1:#2ecc71;--t2:#4aa3ff;--t3:#8a97a6;--accent:#ffb020;--danger:#ff5d5d;--ok:#2ecc71;
  --radius:14px;--pad:12px;--safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom);--side:360px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--panel2);border-radius:10px;padding:9px 12px}
button.primary{background:var(--t1);color:#07130b;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.5}
a{color:var(--t2)}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}

/* top strip */
#strip{display:flex;gap:8px;align-items:center;padding:8px var(--pad);background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;z-index:5;flex:0 0 auto}
#strip::-webkit-scrollbar{display:none}
#strip .brand{font-weight:700;letter-spacing:.2px;margin-right:4px}
#strip .sep{width:1px;height:26px;background:var(--line);flex:0 0 auto}
#strip .spacer{flex:1}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;flex:0 0 auto}
.seg button{background:transparent;padding:6px 12px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--t1);border-color:var(--t1);color:#07130b;font-weight:600}
.chip.warn{background:var(--accent);border-color:var(--accent);color:#1a1200;font-weight:600}
.chip.region.on{background:var(--t2);border-color:var(--t2);color:#041226}

/* main: side list + map */
#main{flex:1;position:relative;min-height:0;display:flex}
#side{flex:0 0 var(--side);width:var(--side);display:flex;flex-direction:column;background:var(--panel);min-height:0;z-index:3;position:relative}
#sideHdr{display:flex;align-items:center;gap:8px;padding:8px var(--pad);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
#sideHdr b{color:var(--text);font-size:14px}
#sideHdr .spacer{flex:1}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px var(--pad) calc(70px + var(--safe-bot))}
#divider{flex:0 0 10px;cursor:col-resize;background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;touch-action:none;z-index:3}
#divider::after{content:'';width:3px;height:40px;border-radius:2px;background:var(--line)}
#main.hideSide #side,#main.hideSide #divider{display:none}
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#0b0e12}
@media (max-width:700px){
  #main{flex-direction:column}
  #divider{display:none}
  #side{flex:0 0 45%;width:auto;border-top:1px solid var(--line);order:2}
}
.item{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px;align-items:flex-start}
.item.sel{border-color:var(--accent)}
.item .pin{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#07130b;margin-top:2px;font-size:13px}
.item .body{flex:1;min-width:0}
.item .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12px;padding:2px 7px;border-radius:7px;background:var(--panel);color:var(--muted)}
.tag.st{color:var(--text)}
.tag.st-Visited{background:#1f4d33;color:#9be3b6}.tag.st-Interested{background:#4d3a10;color:#ffd27a}.tag.st-Follow-up{background:#3a2f66;color:#cbb8ff}.tag.st-Signed{background:#0f4a3f;color:#7fe6c9}.tag.st-Dead{background:#4d1f1f;color:#ff9a9a}
.item .dist{flex:0 0 auto;text-align:right;color:var(--muted);font-size:12px}
.item .dist b{display:block;color:var(--text);font-size:16px}
.item .rt{margin-top:6px;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:transparent;padding:0;color:var(--text);line-height:1}
.item .rt.on{background:var(--accent);border-color:var(--accent);color:#1a1200}
.empty{color:var(--muted);text-align:center;padding:40px 20px}

/* floating map buttons */
#fabs{position:absolute;right:12px;bottom:calc(16px + var(--safe-bot));display:flex;flex-direction:column;gap:10px;z-index:4}
#fabs button{width:48px;height:48px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#fabs button.on{background:var(--t2);color:#041226;border-color:var(--t2)}
#compass{display:none}#compass.show{display:block}
#areaBtn{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:4;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.4);display:none}
#areaBtn.show{display:block}

/* route bar */
#routebar{position:absolute;left:12px;right:72px;bottom:calc(16px + var(--safe-bot));z-index:4;display:none;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#routebar.show{display:flex}
#routebar span{flex:1;font-size:14px}

/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s ease;z-index:10;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.sheet.open{transform:translateY(0)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
.sheet .sc{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px var(--pad) calc(20px + var(--safe-bot))}
@media (min-width:701px){
  .sheet{left:auto;right:12px;bottom:12px;width:440px;max-height:calc(100% - 24px);border-radius:18px;border:1px solid var(--line)}
  /* the lead card sits over the list panel so the map stays clear */
  #card{left:0;right:auto;top:0;bottom:0;width:var(--side);max-height:none;border-radius:0;border:0;border-right:1px solid var(--line);transform:translateX(-105%);box-shadow:none}
  #card.open{transform:translateX(0)}
  #card .grab{display:none}
  #main.hideSide #card{width:min(440px,90vw);border-right:1px solid var(--line)}
}
.sheet h2{margin:6px 0 2px;font-size:20px;line-height:1.25}
.sheet .sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row button{flex:1 1 auto;text-align:center}
.row a{flex:1 1 auto;display:flex}.row a button{width:100%}
.photos{display:flex;gap:8px;overflow-x:auto;margin:10px -12px;padding:0 12px;scroll-snap-type:x mandatory}
.photos::-webkit-scrollbar{display:none}
.photos img{height:190px;border-radius:12px;scroll-snap-align:start;flex:0 0 auto;background:var(--panel2);object-fit:cover}
.photos .ph{height:190px;width:260px;border-radius:12px;flex:0 0 auto;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.sv{width:100%;height:230px;border:0;border-radius:12px;background:var(--panel2);display:block;margin-top:8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin-top:10px}
.kv div:nth-child(odd){color:var(--muted)}
.statuses{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.statuses button{flex:1 1 30%;padding:10px 6px;font-size:14px}
.statuses button.on{outline:2px solid var(--t1);background:#1f4d33}
textarea,input[type=date],input[type=text],input[type=url],input[type=password],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px;outline:none}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
.hdr{display:flex;align-items:center;gap:8px}
.hdr h2{flex:1}
.x{width:36px;height:36px;border-radius:50%;padding:0;font-size:18px}
.pill{display:inline-block;padding:2px 8px;border-radius:7px;font-size:12px;font-weight:600;margin-right:6px}
.T1{background:var(--t1);color:#07130b}.T2{background:var(--t2);color:#041226}.T3{background:var(--t3);color:#0d1116}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--safe-bot));background:#000c;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;display:none;max-width:90%}
.fgroup{margin-top:14px}
.fgroup .lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.fgroup .chips{display:flex;flex-wrap:wrap;gap:6px}
.small{font-size:13px;color:var(--muted)}
/* advanced-marker content */
.pinEl{position:relative;width:30px;height:40px;cursor:pointer}
.pinEl svg{display:block;width:30px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.pinEl.sel{width:40px;height:54px}.pinEl.sel svg{width:40px;height:54px}
.meEl{width:34px;height:34px}
.clusterEl{width:36px;height:36px;border-radius:50%;background:#242b33;border:2px solid #4aa3ff;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="app">
  <div id="strip">
    <span class="brand">Lead Finder</span>
    <button class="chip" id="listBtn">☰ List</button>
    <div class="seg" id="radiusSeg">
      <button data-r="1">1 mi</button><button data-r="3">3 mi</button><button data-r="5">5 mi</button><button data-r="10">10 mi</button><button data-r="0" class="on">All</button>
    </div>
    <span class="sep"></span>
    <span id="regionChips" style="display:contents"></span>
    <span class="sep"></span>
    <button class="chip" id="filterBtn">Filters</button>
    <button class="chip" id="dueBtn">Due today</button>
    <button class="chip" id="hideVisitedBtn">Hide visited</button>
    <span class="spacer"></span>
    <button id="settingsBtn" title="Settings">⚙︎</button>
  </div>
  <div id="main">
    <div id="side">
      <div id="sideHdr"><b id="count"></b><span id="countSub"></span><span class="spacer"></span><span id="sortLbl"></span></div>
      <div id="list"></div>
    </div>
    <div id="divider" title="Drag to resize"></div>
    <div id="mapwrap">
      <div id="map"></div>
      <button id="areaBtn">Search this area</button>
      <div id="fabs">
        <button id="compass" title="Reset north">🧭</button>
        <button id="locBtn" title="Follow me (3 mi)">➤</button>
        <button id="refreshBtn" title="Refresh leads">↻</button>
      </div>
      <div id="routebar"><span id="routeTxt"></span><button id="routeOpen" class="primary">Open route</button><button id="routeClear" class="ghost">Clear</button></div>
    </div>
    <div id="toast"></div>

    <!-- lead card -->
    <div class="sheet" id="card"><div class="grab"></div><div class="sc" id="cardBody"></div></div>

    <!-- filters -->
    <div class="sheet" id="filters"><div class="grab"></div><div class="sc">
      <div class="hdr"><h2>Filters</h2><button class="x" data-close="filters">✕</button></div>
      <div class="fgroup"><div class="lbl">Tier</div><div class="chips" id="fTier"></div></div>
      <div class="fgroup"><div class="lbl">Business type</div><div class="chips" id="fType"></div></div>
      <div class="fgroup"><div class="lbl">Status</div><div class="chips" id="fStatus"></div></div>
      <div class="fgroup"><div class="lbl">Opened within</div><div class="chips" id="fOpened">
        <button class="chip on" data-v="0">Any</button><button class="chip" data-v="3">3 mo</button><button class="chip" data-v="6">6 mo</button><button class="chip" data-v="12">12 mo</button></div></div>
      <div class="fgroup"><div class="lbl">Signals</div><div class="chips">
        <button class="chip" id="fBeer">Beer/wine carryout</button><button class="chip" id="fPhone">Has phone</button><button class="chip" id="fListing">Has Google listing</button></div></div>
      <div class="fgroup"><div class="lbl">Sort list by</div><div class="chips" id="fSort">
        <button class="chip on" data-v="dist">Distance</button><button class="chip" data-v="tier">Tier</button><button class="chip" data-v="opened">Newest</button><button class="chip" data-v="name">Name</button></div></div>
      <div class="row" style="margin-top:18px"><button class="ghost" id="fReset">Reset</button><button class="primary" data-close="filters">Done</button></div>
    </div></div>

    <!-- settings -->
    <div class="sheet" id="settings"><div class="grab"></div><div class="sc">
      <div class="hdr"><h2>Settings</h2><button class="x" data-close="settings">✕</button></div>
      <p class="small">Enter these once; they stay on this device only.</p>
      <label class="f">Apps Script web app URL<input type="url" id="sApi" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="f">API token<input type="password" id="sTok" placeholder="from setup() log"></label>
      <label class="f">Google Maps API key<input type="password" id="sKey" placeholder="AIza…"></label>
      <label class="f">Map ID (optional — enables map rotation; create in Cloud console ▸ Map Management)<input type="text" id="sMap" placeholder="e.g. 1a2b3c4d5e6f7890"></label>
      <div class="row"><button id="sTest" class="ghost">Test connection</button><button id="sSave" class="primary">Save &amp; load</button></div>
      <div class="row"><button id="sClear" class="ghost">Clear cached leads</button><button id="sFlush" class="ghost">Retry pending saves</button></div>
      <p class="small" id="sInfo"></p>
    </div></div>
  </div>
</div>

<script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
<script>
(() => {
'use strict';
// ------------------------------------------------------------ state
const LS = { cfg:'lf.cfg', leads:'lf.leads', ver:'lf.ver', queue:'lf.queue', filters:'lf.filters', route:'lf.route', side:'lf.side' };
const STATUSES = ['Not contacted','Visited','Follow-up','Interested','Signed','Dead'];
const TIER_COLOR = {1:'#2ecc71',2:'#4aa3ff',3:'#8a97a6'};
const STATUS_GLYPH = {'Visited':'✓','Interested':'★','Follow-up':'⏰','Signed':'$','Dead':'✕'};
const DEFAULT_F = {tier:[1,2,3], type:[], region:[], status:[], opened:0, beer:false, phone:false, listing:false, sort:'dist', hideVisited:false, hideDead:true, due:false};
const load = (k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

let cfg = load(LS.cfg, {});
let leads = load(LS.leads, []);
let queue = load(LS.queue, []);
let route = load(LS.route, []);
let F = Object.assign({}, DEFAULT_F, load(LS.filters, {}));
let radiusMi = 0;          // default: everything loaded; radius is a filter
let origin = null;         // {lat,lng} used for distance + radius
let me = null;             // last GPS fix
let follow = false;        // keep map centred on me
let watchId = null;
let map, placesLib, cluster, meMarker, markers = new Map(), selectedId = null, mapReady = false, radiusCircle = null, vector = false;
const byId = () => { const m = new Map(); leads.forEach(l => m.set(l.id, l)); return m; };
let idx = byId();

// ------------------------------------------------------------ utils
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ms=2200){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none', ms); }
function miles(a,b){ if(!a||!b) return null; const R=3958.8, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180; const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function fmtMi(m){ return m==null?'':(m<10?m.toFixed(1):Math.round(m))+' mi'; }
const today = () => new Date().toISOString().slice(0,10);
function monthsSince(d){ if(!d) return null; const t=new Date(d); if(isNaN(t)) return null; const n=new Date(); return (n.getFullYear()-t.getFullYear())*12 + (n.getMonth()-t.getMonth()); }
function openSheet(id){ document.querySelectorAll('.sheet').forEach(s=>s.classList.toggle('open', s.id===id)); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); selectedId=null; refreshMarkerStyles(); document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel')); }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{ closeSheets(); }));
function permits(l){
  const out=[];
  if(l.beerWine) out.push(l.beerWine.replace(/\s*\(#.*?\)/,''));
  if(l.tobacco) out.push('Tobacco'+(l.tobacco!=='Yes'?' '+l.tobacco:''));
  if(l.snap){ const m=String(l.snap).match(/\d{4}-\d{2}-\d{2}/); out.push('SNAP'+(m?' since '+m[0]:'')); }
  if(l.vendorMonth) out.push('Vendor license '+l.vendorMonth);
  if(l.sosDate) out.push('SOS filing '+l.sosDate);
  if(l.propertyDate) out.push('Property purchase '+l.propertyDate);
  return out.join(', ');
}
// Trade name first. When only the legal entity is known, show it as a store name (Title Case, no LLC/INC).
const SMALL = new Set(['and','of','the','&']);
function displayName(l){
  let n = String(l.name||'').trim();
  const legal = String(l.entity||'').trim();
  if(!n) n = legal;
  const isLegal = n.toUpperCase()===legal.toUpperCase() || /\b(LLC|INC|LTD|CORP|L\.L\.C\.|INC\.)\b/i.test(n);
  if(isLegal || n===n.toUpperCase()){
    n = n.replace(/[,.]?\s*\b(L\.?L\.?C\.?|INC\.?|LTD\.?|CORP\.?|CO\.?|LLP)\b\.?/gi,'').replace(/\s{2,}/g,' ').replace(/[,\s]+$/,'').trim();
    n = n.toLowerCase().split(' ').map((w,i)=> (i&&SMALL.has(w))?w : w.replace(/^(\w)/,c=>c.toUpperCase()).replace(/^mc(\w)/,(m,c)=>'Mc'+c.toUpperCase()) ).join(' ');
    n = n.replace(/\b(\d+)(st|nd|rd|th)\b/gi,(m,a,b)=>a+b.toLowerCase());
  }
  return n || legal || '(unnamed)';
}

// ------------------------------------------------------------ filtering
function visible(l){
  if(F.hideDead && l.status==='Dead') return false;
  if(F.hideVisited && (l.status==='Visited')) return false;
  if(F.tier.length && !F.tier.includes(l.tier)) return false;
  if(F.type.length && !F.type.includes(l.type)) return false;
  if(F.region.length && !F.region.includes(l.region)) return false;
  if(F.status.length && !F.status.includes(l.status)) return false;
  if(F.opened){ const m=monthsSince(l.opened); if(m==null || m>F.opened) return false; }
  if(F.beer && !/carryout|C-1|C-2/i.test(l.beerWine||'')) return false;
  if(F.phone && !l.phone) return false;
  if(F.listing && !l.placeId) return false;
  if(F.due && !(l.follow_up && l.follow_up<=today())) return false;
  return true;
}
function current(){
  const out=[];
  for(const l of leads){
    if(!visible(l)) continue;
    l._d = origin ? miles(origin,l) : null;
    if(radiusMi && origin && l._d!=null && l._d>radiusMi) continue;
    out.push(l);
  }
  const s=F.sort;
  out.sort((a,b)=>{
    if(s==='tier') return a.tier-b.tier || (a._d??1e9)-(b._d??1e9);
    if(s==='opened') return (b.opened||'').localeCompare(a.opened||'');
    if(s==='name') return displayName(a).localeCompare(displayName(b));
    return (a._d??1e9)-(b._d??1e9);
  });
  return out;
}

// ------------------------------------------------------------ list
let lastCur = [];
function render(){
  const cur = lastCur = current();

            ${/carryout/i.test(l.beerWine||'')?'<span class="tag">Beer/wine</span>':''}
            ${l.phone?'<span class="tag">☎</span>':''}
            ${l.follow_up?`<span class="tag">Follow-up ${esc(l.follow_up)}</span>`:''}

const MAP_STYLE = [

  {featureType:'transit', stylers:[{visibility:'off'}]},
  {featureType:'administrative.land_parcel', stylers:[{visibility:'off'}]}
];
let markerLib = null;
async function initMap(){
  if(!cfg.mapsKey || mapReady) return;
  if(!window.google || !google.maps){
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({key:cfg.mapsKey, v:'weekly'});
  }
  try{
    const {Map} = await google.maps.importLibrary('maps');
    placesLib = await google.maps.importLibrary('places');
    vector = !!(cfg.mapId && cfg.mapId.trim());
    const opts = { center:{lat:41.0814,lng:-81.519}, zoom:12, disableDefaultUI:true, zoomControl:true, gestureHandling:'greedy', clickableIcons:false };
    if(vector){ opts.mapId = cfg.mapId.trim(); opts.headingInteractionEnabled = true; opts.tiltInteractionEnabled = true; markerLib = await google.maps.importLibrary('marker'); }
    else { opts.styles = MAP_STYLE; }
    map = new Map($('#map'), opts);
    cluster = new markerClusterer.MarkerClusterer({ map, markers:[], algorithmOptions:{maxZoom:15}, renderer:{ render:({count,position})=>makeCluster(count,position) } });
    map.addListener('dragstart', ()=>{ if(follow){ follow=false; $('#locBtn').classList.remove('on'); } });
    map.addListener('dragend', ()=>$('#areaBtn').classList.add('show'));

// --- pin artwork (teardrop, tier colour, status glyph)
function pinSvg(fill, glyph, w, h, sel){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 30 40">`+
    (sel?`<path d="M15 39.5C15 39.5 2 23 2 14A13 13 0 0 1 28 14C28 23 15 39.5 15 39.5Z" fill="none" stroke="#ffb020" stroke-width="4"/>`:'')+
    `<path d="M15 39C15 39 3 23 3 14A12 12 0 0 1 27 14C27 23 15 39 15 39Z" fill="${fill}" stroke="#fff" stroke-width="2"/>`+
    (glyph?`<text x="15" y="18.5" text-anchor="middle" font-family="-apple-system,Helvetica,Arial" font-size="12" font-weight="700" fill="#07130b">${glyph}</text>`:`<circle cx="15" cy="14" r="4" fill="#07130b" opacity=".35"/>`)+`</svg>`;
}
const iconCache = new Map();
function pinIcon(l){ // classic Marker icon
  const sel=l.id===selectedId, key=l.tier+'|'+l.status+'|'+sel;
  if(iconCache.has(key)) return iconCache.get(key);
  const w=sel?40:30, h=sel?54:40;
  const ic={ url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(pinSvg(TIER_COLOR[l.tier]||TIER_COLOR[3], STATUS_GLYPH[l.status]||'', w, h, sel)), scaledSize:new google.maps.Size(w,h), anchor:new google.maps.Point(w/2,h) };
  iconCache.set(key, ic); return ic;
}
function pinEl(l){ // advanced marker content
  const sel=l.id===selectedId; const d=document.createElement('div'); d.className='pinEl'+(sel?' sel':'');
  d.innerHTML=pinSvg(TIER_COLOR[l.tier]||TIER_COLOR[3], STATUS_GLYPH[l.status]||'', sel?40:30, sel?54:40, sel); return d;
}
function makeMarker(l){
  let m;
  if(vector){ m=new markerLib.AdvancedMarkerElement({position:{lat:l.lat,lng:l.lng}, content:pinEl(l), title:displayName(l), zIndex:l.status==='Not contacted'?10:5}); m.addListener('click',()=>openCard(l.id)); }
  else { m=new google.maps.Marker({position:{lat:l.lat,lng:l.lng}, icon:pinIcon(l), title:displayName(l), optimized:true, zIndex:l.status==='Not contacted'?10:5}); m.addListener('click',()=>openCard(l.id)); }
  m._id=l.id; return m;
}
function restyle(m,l){
  const z = l.id===selectedId?500:(l.status==='Not contacted'?10:5);
  if(vector){ m.content=pinEl(l); m.zIndex=z; } else { m.setIcon(pinIcon(l)); m.setZIndex(z); }
}
function makeCluster(count, position){
  if(vector){ const d=document.createElement('div'); d.className='clusterEl'; d.textContent=count; if(count>99){d.style.width='44px';d.style.height='44px';} return new markerLib.AdvancedMarkerElement({position, content:d, zIndex:1000+count}); }
  const size=count>99?44:36; const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${size/2-2}" fill="#242b33" stroke="#4aa3ff" stroke-width="2"/></svg>`;
  return new google.maps.Marker({position, icon:{ url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg), scaledSize:new google.maps.Size(size,size), anchor:new google.maps.Point(size/2,size/2), labelOrigin:new google.maps.Point(size/2,size/2) }, label:{text:String(count), color:'#fff', fontSize:'13px', fontWeight:'700'}, zIndex:1000+count});
}
function renderMarkers(cur){
  const want = new Set(cur.map(l=>l.id));
  const add=[], remove=[];
  for(const [id,m] of markers){ if(!want.has(id)){ remove.push(m); markers.delete(id); } }
  for(const l of cur){ if(!markers.has(l.id)){ const m=makeMarker(l); markers.set(l.id,m); add.push(m); } }
  if(remove.length) cluster.removeMarkers(remove, true);
  if(add.length) cluster.addMarkers(add, true);
  if(add.length||remove.length) cluster.render();
  drawRadius();
}
function refreshMarkerStyles(){ for(const [id,m] of markers){ const l=idx.get(id); if(l) restyle(m,l); } }
function drawRadius(){
  if(!mapReady) return;
  if(radiusCircle){ radiusCircle.setMap(null); radiusCircle=null; }
  if(origin && radiusMi){ radiusCircle=new google.maps.Circle({map, center:origin, radius:radiusMi*1609.34, strokeColor:'#4aa3ff', strokeOpacity:.6, strokeWeight:1, fillColor:'#4aa3ff', fillOpacity:.06, clickable:false}); }
}
function fitRadius(){ if(!mapReady) return; drawRadius(); if(radiusCircle) map.fitBounds(radiusCircle.getBounds(), 20); else if(origin) map.setCenter(origin); }
// --- my position: a person icon
function meSvg(){ return `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#4aa3ff" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="12" r="5" fill="#fff"/><path d="M8 27c1-6 5-8 9-8s8 2 9 8" fill="#fff"/></svg>`; }
function placeMe(){
  if(!mapReady||!me) return;
  if(!meMarker){
    if(vector){ const d=document.createElement('div'); d.className='meEl'; d.innerHTML=meSvg(); meMarker=new markerLib.AdvancedMarkerElement({map, position:me, content:d, zIndex:2000}); }
    else meMarker=new google.maps.Marker({map, position:me, zIndex:2000, icon:{ url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(meSvg()), scaledSize:new google.maps.Size(34,34), anchor:new google.maps.Point(17,17) }});
  } else if(vector) meMarker.position=me; else meMarker.setPosition(me);
}
function fitTo(cur){ if(!mapReady||!cur.length) return; const b=new google.maps.LatLngBounds(); cur.forEach(l=>b.extend({lat:l.lat,lng:l.lng})); if(origin) b.extend(origin); map.fitBounds(b, 40); }
function fitMeAnd(l){ // show the lead and me together, without zooming in past street level
  if(!mapReady) return;
  if(!me){ map.panTo({lat:l.lat,lng:l.lng}); return; }
  const b=new google.maps.LatLngBounds(); b.extend(me); b.extend({lat:l.lat,lng:l.lng});
  map.fitBounds(b, {top:60,bottom:60,left:40,right:40});
  if(map.getZoom()>16) map.setZoom(16);
}
$('#compass').addEventListener('click', ()=>{ if(vector){ map.setHeading(0); map.setTilt(0); } });

// ------------------------------------------------------------ location (live)
function startWatch(){
  if(!navigator.geolocation || watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(onFix, err=>{ toast('Location: '+err.message, 3000); }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
let firstFix = true;
function onFix(p){
  me = {lat:p.coords.latitude, lng:p.coords.longitude};
  const moved = !origin || miles(origin, me) > 0.1;
  if(!origin || (follow && moved)) origin = me;
  placeMe();
  if(moved || firstFix) render();
  if(follow && mapReady){
    map.panTo(me);
    if(vector && p.coords.speed!=null && p.coords.speed>2 && p.coords.heading!=null && !isNaN(p.coords.heading)) map.setHeading(p.coords.heading);
  }
  if(firstFix){ firstFix=false; if(mapReady){ map.setCenter(me); if(map.getZoom()<12) map.setZoom(12); } toast(`Located (±${Math.round(p.coords.accuracy)} m)`); }
}
function followMe(){ // the arrow: 3-mile radius around me, zoomed to fit, and keep following
  follow = true; $('#locBtn').classList.add('on');
  if(me){ origin=me; setRadius(3); render(); fitRadius(); }
  else { setRadius(3); toast('Finding you…', 3000); }
  startWatch();
}
$('#locBtn').addEventListener('click', ()=>{ if(follow){ follow=false; $('#locBtn').classList.remove('on'); toast('Stopped following'); } else followMe(); });
$('#areaBtn').addEventListener('click', ()=>{ if(!mapReady) return; const c=map.getCenter(); origin={lat:c.lat(),lng:c.lng()}; follow=false; $('#locBtn').classList.remove('on'); $('#areaBtn').classList.remove('show'); if(!radiusMi) setRadius(3); render(); drawRadius(); });
$('#radiusSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; setRadius(Number(b.dataset.r)); if(radiusMi && !origin){ origin=me; } render(); if(radiusMi && origin) fitRadius(); else fitTo(current()); });
function setRadius(mi){ radiusMi=mi; [...$('#radiusSeg').children].forEach(x=>x.classList.toggle('on', Number(x.dataset.r)===mi)); }

function chips(container, values, selected, onChange, labelFn){
  container.innerHTML = values.map(v=>`<button class="chip ${selected.includes(v)?'on':''}" data-v="${esc(v)}">${esc(labelFn?labelFn(v):v)}</button>`).join('');
  container.onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; onChange(b.dataset.v); b.classList.toggle('on'); save(LS.filters,F); render(); };
}
function buildFilters(){

const placeCache = new Map();
async function fetchPlace(id){
  if(placeCache.has(id)) return placeCache.get(id);
  if(!placesLib) return null;
  try{
    const place = new placesLib.Place({id});
    await place.fetchFields({fields:['photos','regularOpeningHours','nationalPhoneNumber','websiteURI','businessStatus','rating','userRatingCount']});
    const info = { photos:(place.photos||[]).slice(0,8).map(p=>p.getURI({maxWidth:720,maxHeight:480})), hours:place.regularOpeningHours?.weekdayDescriptions||[], phone:place.nationalPhoneNumber||'', web:place.websiteURI||'', status:place.businessStatus||'', rating:place.rating, ratings:place.userRatingCount };
    placeCache.set(id, info); return info;
  }catch(e){ console.warn('Place fetch failed', e); placeCache.set(id,null); return null; }
}

    if(info && info.photos.length) ph.innerHTML=info.photos.map(u=>`<img src="${u}" alt="">`).join('');
    else ph.innerHTML='<div class="ph">No photos on the listing</div>';
    if(info){ const h=$('#cHours'); const bits=[]; if(info.status&&info.status!=='OPERATIONAL') bits.push(`<span style="color:var(--danger)">Google says: ${esc(info.status.replace(/_/g,' ').toLowerCase())}</span>`); if(info.hours.length) bits.push(info.hours.map(esc).join('<br>')); if(info.web) bits.push(`<a href="${esc(info.web)}" target="_blank" rel="noopener">${esc(info.web.replace(/^https?:\/\//,''))}</a>`); h.innerHTML=bits.join('<br>'); }
  });
}

// ------------------------------------------------------------ route
function toggleRoute(id){ route = route.includes(id)?route.filter(x=>x!==id):[...route,id].slice(-10); save(LS.route,route); render(); }
function renderRouteBar(){ const b=$('#routebar'); b.classList.toggle('show', route.length>0); $('#routeTxt').textContent=`${route.length} stop${route.length===1?'':'s'} in route`; }
$('#routeClear').onclick=()=>{ route=[]; save(LS.route,route); render(); };
$('#routeOpen').onclick=()=>{
  let pts = route.map(id=>idx.get(id)).filter(Boolean);
  if(!pts.length) return;
  let cur = me || origin || pts[0], ordered=[];
  while(pts.length){ pts.sort((a,b)=>miles(cur,a)-miles(cur,b)); const n=pts.shift(); ordered.push(n); cur=n; }
  const p = l=>`${l.lat},${l.lng}`;
  const dest = ordered.pop();
  let url = `https://www.google.com/maps/dir/?api=1&destination=${p(dest)}&travelmode=driving`;
  if(me) url += `&origin=${me.lat},${me.lng}`;
  if(ordered.length) url += `&waypoints=${ordered.map(p).join('|')}`;
  window.open(url,'_blank');
};

// ------------------------------------------------------------ API
async function api(params){
  if(!cfg.apiUrl||!cfg.token) throw new Error('Set the API URL and token in Settings');
  const u = new URL(cfg.apiUrl); u.searchParams.set('token',cfg.token); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r = await fetch(u, {redirect:'follow'}); const j = await r.json(); if(j.error) throw new Error(j.error); return j;
}
async function fetchLeads(force){
  try{
    toast('Loading leads…', 6000);
    const j = await api({action:'leads'});
    const pending = new Map(queue.map(u=>[u.id,u]));
    leads = j.leads.map(l=>{ const u=pending.get(l.id); return u?Object.assign(l,u):l; });
    idx = byId(); save(LS.leads, leads); save(LS.ver, j.version);
    toast(`Loaded ${leads.length} leads`);
    buildRegions(); buildFilters(); render(); if(!me) fitTo(current());
  }catch(e){ toast('Load failed: '+e.message, 5000); }
}
let flushing=false;
async function flush(){
  if(flushing||!queue.length||!navigator.onLine) return;
  flushing=true;
  const batch = queue.slice();
  try{
    const r = await fetch(cfg.apiUrl, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({token:cfg.token, updates:batch})});
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    queue = queue.slice(batch.length); save(LS.queue, queue);
    toast(batch.length>1?`Saved ${batch.length} updates`:'Saved');
  }catch(e){ toast('Save queued (offline?) — will retry', 3000); }
  finally{ flushing=false; }
}
window.addEventListener('online', flush);
setInterval(flush, 30000);

// ------------------------------------------------------------ settings
$('#sSave').onclick=async()=>{
  const mapChanged = ($('#sKey').value.trim()!==(cfg.mapsKey||'')) || ($('#sMap').value.trim()!==(cfg.mapId||''));
  cfg={ apiUrl:$('#sApi').value.trim(), token:$('#sTok').value.trim(), mapsKey:$('#sKey').value.trim(), mapId:$('#sMap').value.trim() };
  save(LS.cfg,cfg); closeSheets();
  if(mapChanged && mapReady){ location.reload(); return; }
  await initMap(); await fetchLeads(true); startWatch();
};
$('#sTest').onclick=async()=>{ cfg.apiUrl=$('#sApi').value.trim(); cfg.token=$('#sTok').value.trim(); try{ const j=await api({action:'ping'}); $('#sInfo').textContent='API OK · '+j.time; }catch(e){ $('#sInfo').textContent='API error: '+e.message; } };
$('#sClear').onclick=()=>{ leads=[]; idx=byId(); localStorage.removeItem(LS.leads); localStorage.removeItem(LS.ver); render(); $('#sInfo').textContent='Cache cleared'; };
$('#sFlush').onclick=()=>{ flush(); };

// ------------------------------------------------------------ boot
(async function boot(){
  $('#dueBtn').classList.toggle('warn',!!F.due); $('#hideVisitedBtn').classList.toggle('on',!!F.hideVisited);
  buildRegions(); render();
  if(!cfg.mapsKey||!cfg.apiUrl||!cfg.token){ $('#settingsBtn').click(); return; }
  await initMap();
  if(!leads.length) await fetchLeads(true); else { buildRegions(); buildFilters(); render(); }
  startWatch();
  flush();
})();
})();
</script>
